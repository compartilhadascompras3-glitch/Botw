#:schema node_modules/wrangler/config-schema.json
# 部署到 Cloudflare Workers + Static Assets。
# `name` 由后端在部署时动态注入（沙箱跑 `wrangler deploy --dry-run --outdir <out>` 时替换占位）。
name = "vibe-web-template"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding   = "ASSETS"

# NEON_DATABASE_URL: banco Neon via HTTP (funciona em CF Workers V8 isolate)
# DATABASE_URL (injetado pelo HappySeeds como secret) usa TCP e não funciona no edge.
[vars]
NEON_DATABASE_URL = "postgresql://neondb_owner:npg_QR7qjwe8zDJC@ep-rapid-mud-acck6848-pooler.sa-east-1.aws.neon.tech/neondb"

